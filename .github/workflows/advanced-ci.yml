name: 高级 CI 演示

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    # 缓存 pip 依赖，提高构建速度
    - name: 缓存 pip 依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 black
        
    # 代码格式检查
    - name: 检查代码格式
      run: |
        echo "🔍 检查代码格式..."
        black --check .
        
    # 代码质量检查
    - name: 代码质量检查
      run: |
        echo "🔍 运行代码质量检查..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    # 运行 pytest 测试
    - name: 运行 pytest 测试
      run: |
        echo "🧪 运行 pytest 测试..."
        pytest tests/ -v
        
    # 运行简单测试
    - name: 运行简单测试
      run: |
        echo "🧪 运行简单测试..."
        python main.py
        echo "✅ 测试通过！"
        
    # 显示构建信息
    - name: 显示构建信息
      run: |
        echo "🎉 构建成功！"
        echo "📊 构建信息："
        echo "   - 运行环境: ${{ runner.os }}"
        echo "   - Python 版本: ${{ steps.setup-python.outputs.python-version }}"
        echo "   - 工作流运行 ID: ${{ github.run_id }}"
        echo "   - 提交信息: ${{ github.event.head_commit.message }}" 